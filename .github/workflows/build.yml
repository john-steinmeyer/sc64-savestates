name: Build

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build N64FlashcartMenu ROM
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/polprzewodnikowy/n64flashcartmenu-ci-devcontainer
          cacheFrom: ghcr.io/polprzewodnikowy/n64flashcartmenu-ci-devcontainer
          configFile: .devcontainer/ci/devcontainer.json
          push: ${{ github.repository_owner == 'Polprzewodnikowy' && 'filter' || 'never' }}
          refFilterForPush: refs/heads/main
          runCmd: |
            make all -j
        env:
          FLAGS: -DNDEBUG

      - name: Upload artifact (Standard ROM)
        uses: actions/upload-artifact@v7
        with:
          name: N64FlashcartMenu
          path: |
            ./output/N64FlashcartMenu.n64
            ./build/N64FlashcartMenu.elf

      - name: Upload artifact (64drive version)
        uses: actions/upload-artifact@v7
        with:
          name: 64drive
          path: ./output/menu.bin

      - name: Upload artifact (ED64 version)
        uses: actions/upload-artifact@v7
        with:
          name: ED64
          path: ./output/OS64.v64

      - name: Upload artifact (ED64P version)
        uses: actions/upload-artifact@v7
        with:
          name: ED64P
          path: ./output/OS64P.v64

      - name: Upload artifact (SC64 version)
        uses: actions/upload-artifact@v7
        with:
          name: SC64
          path: ./output/sc64menu.n64
